name: Build

# Runs on every branch and pull request. Building is not deploying: only
# deploy-pages.yml publishes, and only from main.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:tokens
      - run: npm run build
