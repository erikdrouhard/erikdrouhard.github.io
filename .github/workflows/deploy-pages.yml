name: Deploy website to GitHub Pages

# Only `main` deploys. The redesign branch depends on this staying narrow:
# it is the entire isolation guarantee between work-in-progress and the live
# site at www.erikdrouhard.com. Do not widen this trigger.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for computed typography checks
        run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Validate design system before building for deployment
        run: npm run check
      - name: Verify mobile card navigation and touch gestures
        run: npm run check:touch

      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
